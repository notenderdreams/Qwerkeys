[package]
name = "qwerkeys"
version = "0.1.0"
edition = "2024"

[dependencies]
midir = "0.9.1"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg"] }
egui-phosphor = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10.1", default-features = false, features = ["tls", "gzip"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
debug = false
panic = "abort"
