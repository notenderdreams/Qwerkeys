name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}

      - name: Build & Bundle DMGs
        env:
          TAG: ${{ github.ref_name }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          chmod +x scripts/bundle.sh
          mkdir -p target/release

          VERSION="${TAG#v}"

          # Apple Silicon (arm64)
          cargo build --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/qwerkeys target/release/qwerkeys
          scripts/bundle.sh "$TAG"
          mv "Qwerkeys-${VERSION}.dmg" "Qwerkeys-${VERSION}-arm64.dmg"
          /usr/bin/ditto -c -k --keepParent Qwerkeys.app "Qwerkeys-${VERSION}-arm64.zip"

          # Intel (x86_64)
          cargo build --release --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/qwerkeys target/release/qwerkeys
          scripts/bundle.sh "$TAG"
          mv "Qwerkeys-${VERSION}.dmg" "Qwerkeys-${VERSION}-x86_64.dmg"
          /usr/bin/ditto -c -k --keepParent Qwerkeys.app "Qwerkeys-${VERSION}-x86_64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Qwerkeys-*.dmg
            Qwerkeys-*.zip
